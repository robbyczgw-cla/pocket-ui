# The container has no sound card: a null sink takes the place of the Mini V2's speakers. It runs on
# a real-time clock, so buffer fill and underruns behave like on a device; latency does not.
context.objects = [
    {   factory = adapter
        args = {
            factory.name     = support.null-audio-sink
            node.name        = vdev-speakers
            node.description = "Virtual speakers"
            media.class      = Audio/Sink
            audio.position   = [ FL FR ]
            object.linger    = true
        }
    }
]
