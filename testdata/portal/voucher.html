<html><head><title>Guest Wi-Fi</title></head><body>
<h2>Enter your voucher code</h2>
<p>You find the code on your receipt or ask at the front desk.</p>
<form action="https://portal.example.net:8443/guest/voucher" method="POST" enctype="multipart/form-data">
  Voucher code: <input name="voucher" type="text" placeholder="e.g. 12345-67890">
  <select name="duration"><option value="1h">1 hour</option><option value="24h" selected>24 hours</option></select>
  <input type="password" name="pin" aria-label="PIN (if you have one)">
  <input type="image" src="go.png" alt="Sign in" name="go">
</form></body></html>
