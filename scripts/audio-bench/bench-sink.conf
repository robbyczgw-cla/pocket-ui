# PipeWire drop-in for scripts/audio-bench: a sink that is the graph's driver on its own timer, like the device's
# speaker (alsa sink) or a Bluetooth sink (bluez5's media-sink.c, node.driver = true). Nothing plays anywhere; run.sh
# records the sink's monitor.
context.properties = {
    default.clock.rate          = 48000
    default.clock.allowed-rates = [ 48000 ]
    default.clock.quantum       = 1024
    default.clock.min-quantum   = 32
    default.clock.max-quantum   = 2048
}
context.objects = [
    { factory = adapter
        args = {
            factory.name     = support.null-audio-sink
            node.name        = bench_sink
            media.class      = Audio/Sink
            audio.position   = [ FL FR ]
            audio.format     = S24_32
            audio.rate       = 48000
            node.driver      = true
            priority.driver  = 2000
            monitor.channel-volumes = true
        }
    }
]
