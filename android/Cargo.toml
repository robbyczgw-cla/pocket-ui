[package]
name = "pocket-android"
version = "0.1.5"
edition = "2021"
license = "GPL-2.0-or-later"
publish = false

[lib]
name = "pocket_android"
crate-type = ["cdylib"]

[dependencies]
winit = { version = "0.30.13", default-features = false, features = ["rwh_06", "android-native-activity"] }
android-activity = { version = "0.6", features = ["native-activity"] }
softbuffer = { version = "0.4.6", default-features = false }
jni = "0.21"
log = "0.4"
android_logger = "0.15"
pocket-ui = { path = ".." }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
[profile.release]
lto = "thin"
strip = true
panic = "abort"

# A gamepad's D-pad (hat axes) and left stick reach the launcher as arrow keys: winit 0.30.13 with one patch in
# its Android input path (vendor/winit-0.30.13-android, "pocket-ui patch"). Remove when winit forwards joystick motion.
[patch.crates-io]
winit = { path = "../vendor/winit-0.30.13-android" }
