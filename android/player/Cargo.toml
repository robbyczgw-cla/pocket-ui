[package]
name = "pocket-core-android"
version = "0.1.5"
edition = "2021"
license = "GPL-2.0-or-later"
publish = false

[lib]
name = "pocket_core_android"
crate-type = ["cdylib"]

[dependencies]
pocket-ui = { path = "../.." }
jni = "0.21"
glow = "0.14"
png = "0.17"
log = "0.4"
android_logger = "0.15"
serde_json = "1"

[profile.release]
lto = "thin"
strip = true
panic = "abort"
