# The merge gate's test runner (scripts/gate.sh uses it whenever cargo-nextest is installed; GATE_RUNNER=cargo opts out).
# Exactly ONE retry for every test: a test that passes on the retry is "flaky" (the gate lists it and stays green), a test
# that fails twice makes the gate red. The gate sets the threads (NEXTEST_TEST_THREADS, the cores); 4 is the default here.
[profile.default]
test-threads = 4
fail-fast = false
retries = 1

[profile.default.junit]
path = "junit.xml"

# The tests that assert a time budget (thread CPU time: frames of a few ms, the Curator's and the search's 5,000 games, the
# fast glow) run alone: nothing else is executing while they measure, so a busy gate (hyper-threads, caches) does not fail
# them. Thresholds stay as they are. A new budget test belongs in this filter.
[[profile.default.overrides]]
filter = 'binary(settings_open) | binary(shelf_moves) | test(/::speed_/) | test(=search::tests::five_thousand_games_index_and_search_in_time) | test(=switcher::tests::the_fast_glow_looks_like_the_float_one_and_is_fast)'
threads-required = "num-test-threads"

# The inotify header test measures a real scheduling interval: four free slots.
[[profile.default.overrides]]
filter = 'test(=standalone::tests::a_header_peek_is_not_taken_for_the_state_load)'
threads-required = 4
