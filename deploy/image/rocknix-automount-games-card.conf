# pocket-ui SD image, every family: a games card from ArkOS, dArkOS or a stock R36S in the second slot is used as it is
# (deploy/image/games-card.sh); every other card goes through ROCKNIX's automount, which the script hands over to.
# If the hook is missing on a Qualcomm image, skip the scan. Other images keep ROCKNIX's fallback.
[Service]
ExecStart=
ExecStart=/bin/sh -c 'if [ -x /storage/pocket-ui/games-card.sh ]; then exec /storage/pocket-ui/games-card.sh; fi; . /etc/os-release; case "$$HW_DEVICE" in SM8250|SM8550|SM4450) exit 0;; esac; exec /usr/bin/automount'
