# pocket-ui as the boot UI: a drop-in for ROCKNIX's essway.service (EmulationStation-with-Sway).
# Installed by scripts/autostart.sh as /storage/.config/system.d/essway.service.d/10-pocket-ui.conf.
# Deleting that one file (then daemon-reload, or a reboot) brings plain EmulationStation back.
#
# The unit name stays essway: runemu.sh games stop with it (StopPropagatedFrom=essway.service).
# run-pocket-ui.sh in essway mode (POCKETUI_AS_ESSWAY=1) never stops or starts essway. It goes through its own
# stages (restart, last known good version, safe mode) and execs start_es.sh only when pocket-ui can't start at all
# or the player asked for EmulationStation, so EmulationStation runs in this unit; when it ends, Restart=always (from
# the ROCKNIX unit) starts pocket-ui again. Without the launcher, start_es.sh runs straight away.

[Unit]
# No start limit: a unit that has failed stays failed, and that is a black screen with only sway on it. Instead the
# pause before each restart grows from ROCKNIX's 2 s to a minute over five restarts (RestartSteps, systemd 254 and
# later; ROCKNIX 20261001 has 255), so a launcher and an EmulationStation that both fail at once are tried again
# about once a minute rather than every 2 s, for as long as it takes.
StartLimitIntervalSec=0

[Service]
Environment=POCKETUI_AS_ESSWAY=1
RestartSteps=5
RestartMaxDelaySec=60
ExecStart=
ExecStart=/bin/sh -c 'if [ -x /storage/pocket-ui/run-pocket-ui.sh ]; then exec /storage/pocket-ui/run-pocket-ui.sh; fi; exec /usr/bin/start_es.sh'
