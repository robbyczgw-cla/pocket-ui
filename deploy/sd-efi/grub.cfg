# pocket-ui on the Retroid Pocket Mini V2: Boot mode: Loader -> Retroid u-boot (loader) -> this GRUB -> Linux.
# Boot mode: Android (Retroid's fastboot menu) starts Android as before. Files live on the SD's FAT partition (label ROCKNIX):
#   /EFI/BOOT/BOOTAA64.EFI   GRUB (Debian grub-efi-arm64-bin 2.12)
#   /boot/grub/grub.cfg      this file
#   /boot/pocket/Image       arm64 kernel, unpacked from /KERNEL (must match SYSTEM)
#   /boot/pocket/miniv2-noufs.dtb   Mini V2 device tree, internal UFS disabled: Android stays invisible
# A quiet start (docs/BOOT-SPLASH.md): `quiet loglevel=3` keeps kernel and systemd lines off the screen (they stay in
# dmesg and the journal), `vt.global_cursor_default=0` hides the console's cursor, and there is no GRUB `echo`.
# Remove those three words to see the boot messages again. Never add fbcon=rotate or fbcon=map: sway's turn and the
# touch mapping read /sys/class/graphics/fbcon/rotate.
set timeout=0
set default=0

menuentry "pocket-ui" {
  search --no-floppy --set=root --label ROCKNIX
  devicetree /boot/pocket/miniv2-noufs.dtb
  linux /boot/pocket/Image boot=LABEL=ROCKNIX disk=LABEL=STORAGE rootwait quiet loglevel=3 vt.global_cursor_default=0 console=tty0 video=efifb:off gpt
}

# Only built-in modules exist (no /boot/grub/arm64-efi), so this uses `reboot`, not `halt`.
menuentry "Restart" {
  reboot
}
