# pocket-ui on the Retroid Pocket 6, Pocket 6 TOP-DPAD and Nova (SM8550) without ROCKNIX's ABL: Retroid's "UEFI" in the
# Volume Down menu (or any other UEFI firmware) starts EFI/BOOT/BOOTAA64.EFI, this GRUB, from the card's first partition
# (an EFI system partition). The builder puts the model's tree in for rp6-noufs.dtb (scripts/make-image-family.sh).
# Files on the FAT partition (label ROCKNIX):
#   /EFI/BOOT/BOOTAA64.EFI   GRUB (Debian grub-efi-arm64-bin 2.12)
#   /boot/grub/grub.cfg      this file
#   /boot/pocket/Image       arm64 kernel, unpacked from /KERNEL (must match SYSTEM)
#   /boot/pocket/rp6-noufs.dtb   the model's device tree from /KERNEL, internal UFS disabled: Android stays invisible
# Without the tree the kernel starts but the screen stays black: Retroid's UEFI offers no tree for this kernel.
# The command line is KERNEL's own (ROCKNIX's EXTRA_CMDLINE for SM8550) plus the quiet start of the SM8250 cards
# (docs/BOOT-SPLASH.md: `loglevel=3 vt.global_cursor_default=0`, no GRUB `echo`) and `video=efifb:off` as ROCKNIX's own GRUB.
# loader/entries/pocket-ui.conf starts the same kernel, tree and command line for OpenABL, which reads it before this GRUB;
# change both together (scripts/image/test-h700-pins.sh compares them). Never add fbcon=rotate or fbcon=map: sway's turn
# and the touch mapping read /sys/class/graphics/fbcon/rotate. ROCKNIX's ABL ignores both files and starts /KERNEL.
set timeout=0
set default=0

menuentry "pocket-ui" {
  search --no-floppy --set=root --label ROCKNIX
  devicetree /boot/pocket/rp6-noufs.dtb
  linux /boot/pocket/Image boot=LABEL=ROCKNIX disk=LABEL=STORAGE rootwait quiet loglevel=3 vt.global_cursor_default=0 console=tty0 allow_mismatched_32bit_el0 fw_devlink.strict=1 pcie_ports=compat irqaffinity=0-2 cgroup.memory=nokmem,nosocket nosoftlockup usbcore.interrupt_interval_override=045e:028e:2 video=efifb:off gpt
}

# Only built-in modules exist (no /boot/grub/arm64-efi), so this uses `reboot`, not `halt`.
menuentry "Restart" {
  reboot
}
