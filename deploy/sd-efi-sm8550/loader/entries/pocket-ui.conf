title      pocket-ui
linux      /boot/pocket/Image
devicetree /boot/pocket/rp6-noufs.dtb
options    boot=LABEL=ROCKNIX disk=LABEL=STORAGE rootwait quiet loglevel=3 vt.global_cursor_default=0 console=tty0 allow_mismatched_32bit_el0 fw_devlink.strict=1 pcie_ports=compat irqaffinity=0-2 cgroup.memory=nokmem,nosocket nosoftlockup usbcore.interrupt_interval_override=045e:028e:2 video=efifb:off gpt
